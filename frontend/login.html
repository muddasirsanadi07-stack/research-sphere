<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>Login - ResearchSphere</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="shared/css/style.css">
    <style>
        .login-page {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--bg-dark);
            position: relative;
        }

        .login-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 50px 40px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05);
            position: relative;
            z-index: 10;
        }

        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .login-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 24px;
            text-decoration: none;
        }

        .login-logo img {
            width: 50px;
        }

        .login-logo span {
            color: #1a1a24;
            font-size: 1.8rem;
            font-family: var(--font-heading);
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .login-header h2 {
            font-size: 1.8rem;
            margin-bottom: 10px;
        }

        .login-header p {
            color: var(--text-muted);
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 0.95rem;
        }

        .form-control {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            background: rgba(0, 0, 0, 0.02);
            font-family: inherit;
            font-size: 1rem;
            color: var(--text-main);
            transition: var(--transition);
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 4px rgba(124, 106, 247, 0.1);
            background: #fff;
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            margin-top: 10px;
            font-size: 1.1rem;
        }

        .role-selector {
            margin-bottom: 24px;
            display: flex;
            gap: 10px;
        }

        .role-btn {
            flex: 1;
            padding: 10px;
            border: 1px solid var(--border);
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-family: inherit;
            font-size: 0.9rem;
            color: var(--text-muted);
            transition: var(--transition);
            text-align: center;
        }

        .role-btn.active {
            background: rgba(124, 106, 247, 0.1);
            border-color: var(--accent-primary);
            color: var(--accent-primary);
            font-weight: 600;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 30px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            transition: var(--transition);
        }

        .back-link:hover {
            color: var(--accent-primary);
        }
        
        .error-message {
            color: #ff6347;
            font-size: 0.9rem;
            margin-top: -10px;
            margin-bottom: 15px;
            display: none;
        }
    </style>
</head>

<body class="login-page">

    <!-- Reusing the background aesthetic -->
    <div class="page-background" style="position: absolute;">
        <div class="blob blob-1"></div>
        <div class="blob blob-2" style="top: 80vh; right: 10vw;"></div>
        <div class="grid-overlay"></div>
    </div>

    <div class="login-card">
        <div class="login-header">
            <a href="index.html" class="login-logo">
                <img src="shared/img/cmrit.png" alt="Logo">
                <span>ResearchSphere</span>
            </a>
            <h2>Welcome Back</h2>
            <p>Select your role and sign in to continue.</p>
        </div>

        <form id="login-form">
            <!-- Dummy Role Selector for Demonstration -->
            <label style="display: block; margin-bottom: 10px; font-weight: 500; font-size: 0.95rem;">Select Role</label>
            <div class="role-selector">
                <button type="button" class="role-btn active" data-role="faculty">Faculty</button>
                <button type="button" class="role-btn" data-role="admin">Admin</button>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" class="form-control" placeholder="user@cmrit.edu" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" class="form-control" placeholder="••••••••" required>
            </div>
            
            <div id="error-msg" class="error-message">Invalid credentials.</div>

            <button type="submit" class="btn btn-primary login-btn">Sign In</button>
        </form>

        <div style="text-align: center;">
            <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Homepage</a>
        </div>
    </div>

    <script src="shared/js/auth.js"></script>
</body>

</html>
